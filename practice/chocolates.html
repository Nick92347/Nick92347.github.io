 <html>
    <head>
        <style>
            body{
                background: linear-gradient(135deg, #1a2980, #26d0ce);
                height: 100vh;
            }
            h1{
                text-align: center;
                font-family: Tahoma, sans-serif;
                color: white;
            }
            .container {
              display: grid;
              width: 80vw;
              height: 80vh;
              margin: auto;
              grid-template-columns: 1fr 1fr 1fr;
              grid-template-rows: 1fr 1fr 1fr;
              background-color: Thistle;
              padding: 10px;
              border-radius: 20px;
              border: 8px solid red;
            }
            .heart {
              height: 20vh; /* adjust to control the size */
              aspect-ratio: 1;
              --_m: radial-gradient(#000 69%,#0000 70%) 84.5%/50%;
              -webkit-mask-box-image: var(--_m);
                         mask-border: var(--_m);
              clip-path: polygon(-41% 0,50% 91%, 141% 0);
              background-color: chocolate;
              margin: auto;
            }
            /* fallback until better support for mask-border */
            @supports not (-webkit-mask-box-image: var(--_m)) { 
              .heart {
                mask:
                 radial-gradient(at 70% 31%,#000 29%,#0000 30%),
                 radial-gradient(at 30% 31%,#000 29%,#0000 30%),
                 conic-gradient(#000 0 0) bottom/100% 50% no-repeat;
              }
            }
            .chocolateheart{

            }
            .lilbits{
                grid-column-start: 1;
                grid-row-start: 1;
                display: grid;
              grid-template-columns: 1fr 1fr 1fr;
              grid-template-rows: 1fr 1fr 1fr;
            }
            .mnms{
                width:10vh;
                height:10vh;
                background-color:red;
                border-radius:50%;
                margin: auto;
                display: grid;
                place-items: center;
                font-size: 2em;
            }

        </style>
    </head>
    <body>
        <h1>Here, I got you some chocolates &lt;3</h1>
        <div class="container">
            <div class="lilbits">
		<div class="mnms" style="grid-area: 1/2">m</div>
		<div class="mnms" style="grid-area: 1/3/">m</div>
		<div class="mnms" style="grid-area: 1/4/">m</div>
		<div class="mnms" style="grid-area: 2/2/">m</div>
		<div class="mnms" style="grid-area: 2/3/">m</div>
		<div class="mnms" style="grid-area: 2/4/">m</div> 
		<div class="mnms" style="grid-area: 3/2/">m</div>
		<div class="mnms" style="grid-area: 3/3/">m</div>
		<div class="mnms" style="grid-area: 3/4/">m</div>
            </div>


            <div class="heart chocolateheart" style="grid-area: 1/3"></div>
            <div class="heart chocolateheart" style="grid-area: 2/3"></div>
            <div class="heart chocolateheart" style="grid-area: 3/3"></div>

            <div class="heart chocolateheart" style="grid-area: 1/2"></div>
            <div class="heart chocolateheart" style="grid-area: 2/2"></div>
            <div class="heart chocolateheart" style="grid-area: 3/2"></div>

            <div class="heart chocolateheart" style="grid-area: 2/1"></div>
            <div class="heart chocolateheart" style="grid-area: 3/1"></div>
        </div>
    </body>
</html>
