<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; }
    img { display: block; width: 100%; background: #ddd; }
    button { padding: 0.5rem 1.5rem; border: none; border-radius: 5px; background: #333; color: #fff; cursor: pointer; }
    nav { display: flex; gap: 1rem; }
    nav a { text-decoration: none; color: inherit; }
    input[type="text"] { padding: 0.4rem 0.75rem; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; width: 100%; }
    label { display: flex; align-items: center; gap: 0.5rem; }
    /* Layout */
    .c1 {
      display: flex;
      align-items: center;
    }
    .c2 {
      display: inline-block;
      vertical-align: middle;
      width: 10%;
      aspect-ratio: 8 / 3;
      float: left;
      margin: 0 1rem 0.5rem 0;
    }
    .c3 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
    }
  </style>
</head>
<body>
<header class="c1">
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Work</a>
    <a href="#">Contact</a>
  </nav>
  <img src="placeholder.jpg" alt="" class="c2">
  <div class="c3">
    <input type="text" placeholder="Enter text">
    <button>Click me</button>
  </div>
</header>
  <script>
  (function() {
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/gh/gracehoppercenter/validate@1.0.5/validate.js";
    s.async = false;
    document.head.appendChild(s);
  })();
  </script>
</body>
</html>
